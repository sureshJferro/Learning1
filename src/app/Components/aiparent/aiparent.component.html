<p >aiparent works!</p>
<p>{{ message }}</p>
<p>{{childMsg}}</p>
<button (click)="getUsersfromAPI()">Fetch Users</button>
<button (click)="startFilter()">Start Filter</button>
<button (click)="startMergeMap()">Start Merge</button>
<input type="number" [(ngModel)]="filterid" >
<input type="name" [(ngModel)]="name" placeholder="name">
<ul>
  <li *ngFor="let user of users">{{ user.name }}</li>
</ul>

<app-aichild [parentMessage]="message" (childMessage)="receiveMessage($event)" (childPosts)="fillPosts($event)">
  <p #parenttext>gdhalkfhlkahslhfslkfl</p>
</app-aichild>
<button (click)="Viewchildmsg()">View Child msg</button>

<h4 *ngIf="posts.length>0">POSTS</h4>
<ol>
  <li *ngFor="let post of posts" style="padding: 10px;">
<a><b>{{ post.title }} - </b><i>{{post.body}}</i></a></li>
</ol> 

<div class="layout-column align-items-center mt-50">

  <section class="layout-row align-items-center justify-content-between">
    <label>Celsius: </label>
    <input type="number" class="large" [(ngModel)]= Celsius data-test-id="celsius-input" (keyup)="keyupCelsius()"/>
  </section>

  <section class="layout-row align-items-center justify-content-between">
      <label>Fahrenheit: </label>
      <input type="number" class="large" [(ngModel)]=Faren data-test-id="fahrenheit-input" (keyup)="keyupFaren()"/>
  </section>
</div>
